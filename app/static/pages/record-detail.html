<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试详情 — AI 面试官</title>
  <link href="../css/theme.css" rel="stylesheet">
  <script src="../js/vue.global.prod.js"></script>
  <script src="../js/axios.min.js"></script>
  <script src="../js/report_download.js"></script>
  <style>
    body {
      background: var(--bg-primary);
      min-height: 100vh;
      padding: var(--space-6);
      font-family: var(--font-sans);
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* 返回按钮 */
    .top-bar {
      margin-bottom: var(--space-6);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: var(--text-sm);
      font-weight: var(--fw-medium);
      transition: color var(--transition-fast);
    }

    .back-link:hover {
      color: var(--accent-primary);
    }

    /* 卡片通用 */
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-2xl);
      padding: var(--space-6);
      margin-bottom: var(--space-4);
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-base);
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-title {
      font-size: var(--text-lg);
      font-weight: var(--fw-semibold);
      color: var(--text-primary);
      margin-bottom: var(--space-5);
      letter-spacing: -0.02em;
    }

    /* 头部卡片 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: var(--space-6);
    }

    .position-name {
      font-size: var(--text-2xl);
      font-weight: var(--fw-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-2);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .meta {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--fw-medium);
      line-height: 1.4;
    }

    .badge-done {
      background: var(--success-bg);
      color: var(--success-fg);
    }

    .badge-doing {
      background: var(--warning-bg);
      color: var(--warning-fg);
    }

    .badge-early {
      background: var(--bg-secondary);
      color: var(--text-tertiary);
    }

    .total-score {
      text-align: center;
      flex-shrink: 0;
    }

    .total-score .num {
      font-size: 3.5rem;
      font-weight: var(--fw-bold);
      color: var(--accent-primary);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .total-score .unit {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      margin-top: var(--space-2);
    }

    .dl-btn {
      margin-top: var(--space-4);
      height: 38px;
      padding: 0 18px;
      font-size: var(--text-sm);
    }

    /* 评分条 */
    .score-row {
      display: flex;
      align-items: center;
      margin-bottom: var(--space-4);
      gap: var(--space-4);
    }

    .score-row:last-child {
      margin-bottom: 0;
    }

    .score-label {
      width: 88px;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      flex-shrink: 0;
      font-weight: var(--fw-medium);
    }

    .score-track {
      flex: 1;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: var(--accent-primary);
      border-radius: var(--radius-full);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .score-value {
      width: 48px;
      text-align: right;
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--accent-primary);
      flex-shrink: 0;
    }

    .desc-text {
      margin-top: var(--space-5);
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.7;
    }

    /* 三列网格 */
    .grid3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .grid3 .card {
      margin-bottom: 0;
    }

    .grid3 h4 {
      font-size: var(--text-base);
      font-weight: var(--fw-semibold);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .grid3 ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .grid3 ul li {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      padding: var(--space-2) 0;
      padding-left: var(--space-4);
      position: relative;
      line-height: 1.7;
    }

    .grid3 ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .strengths-title {
      color: var(--success-fg);
    }

    .card:has(.strengths-title) ul li::before {
      background: var(--success-fg);
    }

    .improve-title {
      color: var(--warning-fg);
    }

    .card:has(.improve-title) ul li::before {
      background: var(--warning-fg);
    }

    .advice-title {
      color: var(--accent-primary);
    }

    .card:has(.advice-title) ul li::before {
      background: var(--accent-primary);
    }

    .advice-item-title {
      font-weight: var(--fw-semibold);
      color: var(--text-primary);
    }

    /* 逐题列表 */
    .question-item {
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--space-5) 0;
    }

    .question-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .question-item:first-child {
      padding-top: 0;
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .q-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: var(--accent-primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      margin-right: var(--space-3);
      flex-shrink: 0;
    }

    .q-text {
      font-weight: var(--fw-semibold);
      color: var(--text-primary);
      line-height: 1.6;
      flex: 1;
      font-size: var(--text-base);
    }

    .q-score {
      color: var(--accent-primary);
      font-weight: var(--fw-semibold);
      font-size: var(--text-base);
      flex-shrink: 0;
    }

    .q-section {
      margin-top: var(--space-3);
      padding-left: calc(28px + var(--space-3));
    }

    .q-section .label {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-2);
      font-weight: var(--fw-medium);
    }

    .q-section .content {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .no-answer {
      color: var(--text-tertiary);
      font-style: italic;
    }

    .q-comment {
      margin-top: var(--space-4);
      padding: var(--space-4) var(--space-5);
      background: rgba(0, 122, 255, 0.06);
      border-left: 3px solid var(--accent-primary);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-left: calc(28px + var(--space-3));
    }

    .empty-tip {
      text-align: center;
      color: var(--text-tertiary);
      padding: var(--space-16) 0;
      font-size: var(--text-sm);
    }

    .error-box {
      text-align: center;
      padding: var(--space-16) var(--space-8);
    }

    .error-box h2 {
      color: var(--error-fg);
      margin-bottom: var(--space-3);
      font-size: var(--text-xl);
      font-weight: var(--fw-semibold);
    }

    .error-box p {
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }

    /* 响应式 */
    @media (max-width: 640px) {
      body {
        padding: var(--space-4);
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .total-score {
        text-align: left;
      }

      .total-score .num {
        font-size: 2.5rem;
      }

      .q-section,
      .q-comment {
        padding-left: 0;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div class="top-bar">
      <a data-dom-id="nav-admin" href="admin.html" class="back-link">← 返回主页</a>
    </div>

    <!-- 加载失败 -->
    <div v-if="error" class="card error-box">
      <h2>加载失败</h2>
      <p>{{ error }}</p>
    </div>

    <template v-else-if="detail">
      <!-- 头部：岗位、时间、状态、总分 -->
      <div class="card header">
        <div>
          <div class="position-name">
            {{ positionName }}
            <span class="badge" :class="statusBadgeClass">{{ statusText }}</span>
          </div>
          <div class="meta">面试时间：{{ formattedTime }} · 共 {{ detail.questions.length }} 题</div>
        </div>
        <div class="total-score" v-if="totalScore !== null">
          <span class="num">{{ totalScore }}</span>
          <div class="unit">综合评分</div>
          <button class="gt-btn gt-btn-primary dl-btn" @click="downloadReport">
            下载报告
          </button>
        </div>
      </div>

      <!-- 综合评价 -->
      <div class="card" v-if="evaluation">
        <div class="card-title">综合评价</div>
        <div class="score-row" v-for="dim in dimensionScores" :key="dim.name">
          <span class="score-label">{{ dim.name }}</span>
          <div class="score-track"><div class="score-fill" :style="{ width: dim.pct + '%' }"></div></div>
          <span class="score-value">{{ dim.score }}</span>
        </div>
        <p class="desc-text" v-if="evaluation.description">
          {{ evaluation.description }}
        </p>
      </div>

      <!-- 优势 / 改进 / 建议 -->
      <div class="grid3" v-if="evaluation">
        <div class="card" v-if="evaluation.strengths && evaluation.strengths.length">
          <h4 class="strengths-title">优势亮点</h4>
          <ul><li v-for="(s, i) in evaluation.strengths" :key="'s' + i">{{ s }}</li></ul>
        </div>
        <div class="card" v-if="evaluation.improvements && evaluation.improvements.length">
          <h4 class="improve-title">待改进</h4>
          <ul><li v-for="(s, i) in evaluation.improvements" :key="'i' + i">{{ s }}</li></ul>
        </div>
        <div class="card" v-if="evaluation.recommendations && evaluation.recommendations.length">
          <h4 class="advice-title">成长建议</h4>
          <ul>
            <li v-for="(s, i) in evaluation.recommendations" :key="'r' + i">
              <template v-if="adviceOf(s).title">
                <span class="advice-item-title">{{ adviceOf(s).title }}：</span>{{ adviceOf(s).desc }}
              </template>
              <template v-else>{{ adviceOf(s).desc }}</template>
            </li>
          </ul>
        </div>
      </div>

      <!-- 逐题明细 -->
      <div class="card">
        <div class="card-title">问答明细</div>
        <div class="question-item" v-for="(q, idx) in detail.questions" :key="q.id">
          <div class="q-header">
            <div style="display: flex; align-items: flex-start; flex: 1;">
              <span class="q-index">{{ idx + 1 }}</span>
              <span class="q-text">{{ q.question }}</span>
            </div>
            <span class="q-score" v-if="questionScore(idx) !== null">{{ questionScore(idx) }} 分</span>
          </div>
          <div class="q-section">
            <div class="label">你的回答</div>
            <div class="content" :class="{ 'no-answer': !q.answer_text }">
              {{ q.answer_text || '未回答' }}
            </div>
          </div>
          <div class="q-comment" v-if="questionComment(idx)">
            {{ questionComment(idx) }}
          </div>
        </div>
      </div>
    </template>

    <!-- 加载中 -->
    <div v-else class="card empty-tip">加载中…</div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          token: '',
          detail: null,
          error: '',
        };
      },
      computed: {
        evaluation() {
          return this.detail && this.detail.report ? this.detail.report.evaluation : null;
        },
        positionName() {
          const name = this.detail && this.detail.report ? this.detail.report.position_name : null;
          return name || '模拟面试';
        },
        totalScore() {
          return this.evaluation ? this.evaluation.averageScore : null;
        },
        dimensionScores() {
          if (!this.evaluation || !this.evaluation.scores) return [];
          const names = { professional: '专业知识', communication: '表达能力', comprehensive: '综合素养' };
          return Object.entries(names)
            .filter(([key]) => this.evaluation.scores[key] !== undefined)
            .map(([key, name]) => ({
              name,
              score: this.evaluation.scores[key],
              pct: this.evaluation.scores[key],
            }));
        },
        statusText() {
          const map = { 0: '待出题', 1: '试题已备好', 2: '面试进行中', 3: '已答完', 4: '报告已生成' };
          return map[this.detail.interview.status] || '未知状态';
        },
        statusBadgeClass() {
          const map = { 4: 'badge-done', 3: 'badge-doing', 2: 'badge-doing' };
          return map[this.detail.interview.status] || 'badge-early';
        },
        formattedTime() {
          const t = this.detail.interview.start_time;
          if (!t || t <= 0) return '未设置时间';
          const d = new Date(t * 1000);
          const pad = n => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        },
      },
      methods: {
        questionEval(idx) {
          if (!this.evaluation || !Array.isArray(this.evaluation.question_evaluations)) return null;
          return this.evaluation.question_evaluations[idx] || null;
        },
        questionScore(idx) {
          const qe = this.questionEval(idx);
          return qe && typeof qe.score === 'number' ? qe.score : null;
        },
        questionComment(idx) {
          const qe = this.questionEval(idx);
          return qe ? (qe.comments || '') : '';
        },
        adviceOf(s) {
          if (s && typeof s === 'object') {
            return { title: s.title || '', desc: s.description || s.desc || '' };
          }
          return { title: '', desc: String(s || '') };
        },
        downloadReport() {
          if (!this.evaluation) return;
          downloadInterviewReport({
            position: this.positionName,
            time: this.formattedTime,
            totalScore: this.evaluation.averageScore,
            recommendation: this.evaluation.recommendation || '',
            scores: this.evaluation.scores || {},
            detailedScores: this.evaluation.detailedScores || [],
            description: this.evaluation.description || '',
            strengths: this.evaluation.strengths || [],
            improvements: this.evaluation.improvements || [],
            recommendations: this.evaluation.recommendations || [],
            questions: this.detail.questions.map((q, i) => {
              const qe = this.questionEval(i);
              return {
                text: q.question,
                answer: q.answer_text,
                score: qe ? qe.score : null,
                comment: qe ? (qe.comments || '') : ''
              };
            })
          });
        },
        async loadDetail() {
          try {
            const response = await axios.get(`/api/interview/${this.token}/detail`);
            this.detail = response.data;
          } catch (err) {
            this.error = err.response && err.response.status === 404
              ? '面试记录不存在，token 可能有误'
              : '服务器连接失败，请稍后重试';
          }
        },
      },
      mounted() {
        this.token = new URLSearchParams(window.location.search).get('token') || '';
        if (!this.token) {
          this.error = '缺少 token 参数，请从主页的面试记录进入';
          return;
        }
        this.loadDetail();
      },
    }).mount('#app');
  </script>
</body>
</html>
